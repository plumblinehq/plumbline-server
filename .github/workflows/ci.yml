name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci resolves the checks dependency by cloning github, and the
      # lockfile records that as git+ssh; rewrite to the runner's token.
      - run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      # The server runs on tsx with noEmit TypeScript, so there is no emit
      # step to verify. "Build" here means the runtime program graph loads —
      # including the git-pinned checks package — and the entrypoints fail
      # fast with the missing-variable error instead of crashing deeper.
      - run: npx tsx -e "Promise.all([import('./src/store.js'), import('./src/scanner.js'), import('./src/server.js'), import('./src/migrate.js')]).then(() => console.log('runtime imports OK'))"
      - name: entrypoints fail fast without configuration
        run: |
          for entry in src/migrate.ts src/index.ts; do
            if npx tsx "$entry" >out.txt 2>err.txt; then
              echo "expected $entry to fail without DATABASE_URL"
              exit 1
            fi
            grep -q "DATABASE_URL" err.txt
          done
