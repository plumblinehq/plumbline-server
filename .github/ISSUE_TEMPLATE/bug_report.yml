name: Bug report
description: Report a bug in the server, scheduler, or API
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filling out a bug report. If the bug is about a check's
        result, the fix belongs in `plumbline-checks`, not here — this repo
        contains no check logic.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happens? Include the endpoint, status code, and any error message.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The request you made, the environment, and any output that helps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, package version (from `npm ls`), Postgres version, platform.