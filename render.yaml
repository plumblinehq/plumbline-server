# Render Blueprint for plumbline-server. Create it from the dashboard:
# "New +" → "Blueprint" → this repo, branch main. The only manual step is
# DATABASE_URL (sync: false): paste the Neon connection string there.
#
# This service is the API only — it does not scan. Scanning runs on a
# schedule from .github/workflows/scan.yml, so the free plan spinning the
# service down after 15 minutes of inactivity costs the API a cold start and
# costs the scan nothing. The recorded interval is the workflow's, not
# whenever someone happened to wake the host.
#
# Region matches the Neon project: the connection string's host is
# ep-falling-union-axzczs0v-pooler.c-4.us-east-2.aws.neon.tech (Ohio).
services:
  - type: web
    name: plumbline-server
    runtime: node
    plan: free
    region: ohio
    buildCommand: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/" && npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Behind Render's proxy, per-IP rate limiting needs X-Forwarded-For.
      - key: TRUST_PROXY
        value: "true"
      # Set in the dashboard when creating the service: the Neon connection
      # string. Never commit a database credential.
      - key: DATABASE_URL
        sync: false